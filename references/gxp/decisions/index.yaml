kind: decisions
package: bridger-gxp
infix: GX
entries:
  - id: "ADR-GX-001"
    file: "001-separate-package.md"
    title: "The companion is a separate package; core never depends on it"
    status: "Proposed"
  - id: "ADR-GX-002"
    file: "002-own-tree-and-gx-series.md"
    title: "An own specification tree, process and GX identifier series"
    status: "Proposed"
  - id: "ADR-GX-003"
    file: "003-ports-without-defaults.md"
    title: "Every store, identity, signature and key is a caller-supplied port with no default"
    status: "Proposed"
  - id: "ADR-GX-004"
    file: "004-append-only-trail-store.md"
    title: "The trail store is append-only, idempotent on recordId and unique per host sequence"
    status: "Proposed"
  - id: "ADR-GX-005"
    file: "005-jcs-and-sha256.md"
    title: "RFC 8785 canonical JSON and SHA-256 for every digest"
    status: "Proposed"
  - id: "ADR-GX-006"
    file: "006-conformance-through-testhost.md"
    title: "Adapter conformance runs against the real core through TestHost"
    status: "Proposed"
  - id: "ADR-GX-007"
    file: "007-checks-never-claim-integrity.md"
    title: "Checks on read report findings and never claim integrity"
    status: "Proposed"
  - id: "ADR-GX-008"
    file: "008-high-water-anchors.md"
    title: "Tail loss is detected against external high-water marks"
    status: "Proposed"
  - id: "ADR-GX-009"
    file: "009-optional-sealing.md"
    title: "Optional sealing: a per-host hash chain with separately held anchors"
    status: "Proposed"
  - id: "ADR-GX-010"
    file: "010-sign-first-then-call.md"
    title: "Approval is signed before the call; the gate only checks a ticket"
    status: "Proposed"
  - id: "ADR-GX-011"
    file: "011-ticket-cited-by-correlation-id.md"
    title: "A call cites its ticket by correlationId; reconcile uses bundles"
    status: "Proposed"
  - id: "ADR-GX-012"
    file: "012-binding-contents.md"
    title: "What a binding covers and how its digest is computed"
    status: "Proposed"
  - id: "ADR-GX-013"
    file: "013-single-use-tickets.md"
    title: "Bindings are single-use and consumed at authorize by compare-and-set"
    status: "Proposed"
  - id: "ADR-GX-014"
    file: "014-deny-by-default-policy.md"
    title: "The approval policy denies by default; exemptions are explicit"
    status: "Proposed"
  - id: "ADR-GX-015"
    file: "015-separation-of-duties.md"
    title: "Separation of duties is enforced on actor identifiers"
    status: "Proposed"
  - id: "ADR-GX-016"
    file: "016-signature-port-and-manifestation.md"
    title: "The signature port, mandatory manifestation and re-authentication attestation"
    status: "Proposed"
  - id: "ADR-GX-017"
    file: "017-hmac-through-the-core-port.md"
    title: "Fingerprints are HMACs computed through the core ConfigFingerprinter port"
    status: "Proposed"
  - id: "ADR-GX-018"
    file: "018-eligibility-allow-list.md"
    title: "Fingerprint eligibility is an allow-list, deny by default"
    status: "Proposed"
  - id: "ADR-GX-019"
    file: "019-key-provider-and-rotation.md"
    title: "Keys come from a caller-supplied provider; rotation forces ticket re-issue"
    status: "Proposed"
  - id: "ADR-GX-020"
    file: "020-iq-proof-and-probe.md"
    title: "Installation checks distinguish proof from probe"
    status: "Proposed"
  - id: "ADR-GX-021"
    file: "021-oq-from-runner-output.md"
    title: "OQ results come only from test-runner output"
    status: "Proposed"
  - id: "ADR-GX-022"
    file: "022-evidence-pack-format.md"
    title: "The evidence pack format"
    status: "Proposed"
  - id: "ADR-GX-023"
    file: "023-archives-keep-original-bytes.md"
    title: "Archives keep the original canonical bytes"
    status: "Proposed"
  - id: "ADR-GX-024"
    file: "024-fixtures-are-marked.md"
    title: "Test fixtures are marked and refused by installation checks"
    status: "Proposed"
  - id: "ADR-GX-025"
    file: "025-core-version-range.md"
    title: "A core minor-line range and a compatibility matrix"
    status: "Proposed"
  - id: "ADR-GX-026"
    file: "026-prospective-specification.md"
    title: "This specification is prospective"
    status: "Proposed"
  - id: "ADR-GX-027"
    file: "027-claims-and-non-claims.md"
    title: "Claims and non-claims of the companion"
    status: "Proposed"
  - id: "ADR-GX-028"
    file: "028-checker-copy-and-adapt.md"
    title: "The traceability checker is copied and adapted from core's"
    status: "Proposed"
