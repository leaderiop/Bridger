kind: decisions
package: bridger-core
infix: BR
entries:
  - id: "ADR-BR-001"
    file: "001-effect-v4-as-effect-system.md"
    title: "Effect v4 as the effect system"
    status: "Proposed"
  - id: "ADR-BR-002"
    file: "002-plugin-build-is-a-layer.md"
    title: "A plugin's build is an Effect Layer"
    status: "Proposed"
  - id: "ADR-BR-003"
    file: "003-one-provider-per-key-per-realm.md"
    title: "One provider per service key per realm"
    status: "Proposed"
  - id: "ADR-BR-004"
    file: "004-replace-is-stop-then-start.md"
    title: "Replace is stop-then-start with no rollback"
    status: "Proposed"
  - id: "ADR-BR-005"
    file: "005-failure-is-sticky.md"
    title: "Failure is sticky and retry is never automatic"
    status: "Proposed"
  - id: "ADR-BR-006"
    file: "006-one-instance-per-id-per-realm.md"
    title: "One instance per plugin ID per realm"
    status: "Proposed"
  - id: "ADR-BR-007"
    file: "007-observation-primitives.md"
    title: "SubscriptionRef state feed and sliding PubSub event log"
    status: "Proposed"
  - id: "ADR-BR-008"
    file: "008-error-taxonomy.md"
    title: "Schema.TaggedError taxonomy carrying identifiers only"
    status: "Proposed"
  - id: "ADR-BR-009"
    file: "009-managedruntime-hosting.md"
    title: "Non-Effect hosting through ManagedRuntime"
    status: "Proposed"
  - id: "ADR-BR-010"
    file: "010-cordis-parity.md"
    title: "Cordis feature parity and what is not adopted"
    status: "Proposed"
  - id: "ADR-BR-011"
    file: "011-serviceid-is-key-identity.md"
    title: "ServiceId is key identity and mismatched key objects fail"
    status: "Proposed — amended by ADR-BR-040"
  - id: "ADR-BR-012"
    file: "012-intent-and-linearization.md"
    title: "Operations record intent and are linearized per plugin"
    status: "Proposed"
  - id: "ADR-BR-013"
    file: "013-total-operation-legality.md"
    title: "The state by operation table is total"
    status: "Proposed"
  - id: "ADR-BR-014"
    file: "014-discriminated-plugin-snapshot.md"
    title: "PluginSnapshot is a discriminated union"
    status: "Proposed"
  - id: "ADR-BR-015"
    file: "015-leases-one-primitive.md"
    title: "Leases are one bounded primitive with a supervised child"
    status: "Proposed"
  - id: "ADR-BR-016"
    file: "016-reentrancy-detection.md"
    title: "Re-entrancy is detected through a carried reference"
    status: "Proposed"
  - id: "ADR-BR-017"
    file: "017-runtime-failure-one-transition.md"
    title: "Three runtime failure signals and one transition"
    status: "Proposed"
  - id: "ADR-BR-018"
    file: "018-configuration-decoded-before-build.md"
    title: "Configuration is decoded before build and never observable"
    status: "Proposed"
  - id: "ADR-BR-019"
    file: "019-realms-are-resolution-namespaces.md"
    title: "Realms are resolution namespaces, not security boundaries"
    status: "Proposed — amended by ADR-BR-043 and ADR-BR-048"
  - id: "ADR-BR-020"
    file: "020-typed-event-bus.md"
    title: "A typed event bus as a base service"
    status: "Proposed"
  - id: "ADR-BR-021"
    file: "021-children-and-groups.md"
    title: "Children and groups are scope-owned plugins"
    status: "Proposed"
  - id: "ADR-BR-022"
    file: "022-optional-and-reactive-dependencies.md"
    title: "Optional and reactive dependencies never gate activation"
    status: "Proposed"
  - id: "ADR-BR-023"
    file: "023-desired-state-reconcile.md"
    title: "Desired-state reconcile is keyed, owned and idempotent"
    status: "Proposed — amended by ADR-BR-051"
  - id: "ADR-BR-024"
    file: "024-shared-state-helpers.md"
    title: "ContributionRegistry and Generation are core helpers"
    status: "Proposed — amended by ADR-BR-052"
  - id: "ADR-BR-025"
    file: "025-deterministic-time-and-ids.md"
    title: "Time and identifiers come from services"
    status: "Proposed"
  - id: "ADR-BR-026"
    file: "026-deterministic-test-host.md"
    title: "A deterministic test host is part of the core contract"
    status: "Proposed"
  - id: "ADR-BR-027"
    file: "027-core-exclusions.md"
    title: "Core exclusions"
    status: "Proposed — amended by ADR-BR-040, ADR-BR-041 and ADR-BR-042"
  - id: "ADR-BR-028"
    file: "028-gxp-scope.md"
    title: "GxP scope: process, core hooks and a companion"
    status: "Proposed"
  - id: "ADR-BR-029"
    file: "029-attributable-mutations.md"
    title: "Every host mutation is attributable"
    status: "Proposed — amended by ADR-BR-044 and ADR-BR-054"
  - id: "ADR-BR-030"
    file: "030-audit-sink-port.md"
    title: "An optional AuditSink port distinct from Host.events"
    status: "Proposed"
  - id: "ADR-BR-031"
    file: "031-audit-failure-policy.md"
    title: "Audit failure fails closed and latches"
    status: "Proposed"
  - id: "ADR-BR-032"
    file: "032-operation-gate.md"
    title: "An OperationGate port in core"
    status: "Proposed — amends ADR-BR-020; amended by ADR-BR-053"
  - id: "ADR-BR-033"
    file: "033-no-config-values-in-audit.md"
    title: "Audit records carry configuration paths, never values"
    status: "Proposed"
  - id: "ADR-BR-034"
    file: "034-gxp-companion-scope.md"
    title: "The @bridger/gxp companion scope and its limits"
    status: "Proposed"
  - id: "ADR-BR-035"
    file: "035-evidence-from-executed-tests.md"
    title: "Qualification evidence comes only from executed tests"
    status: "Proposed"
  - id: "ADR-BR-036"
    file: "036-prospective-specification.md"
    title: "This specification is prospective"
    status: "Proposed"
  - id: "ADR-BR-037"
    file: "037-audit-sequence-separate-from-event-seq.md"
    title: "The audit sequence is separate from the event seq"
    status: "Proposed"
  - id: "ADR-BR-038"
    file: "038-cross-plugin-stop-ordering.md"
    title: "Cross-plugin stops wait only along dependency edges"
    status: "Proposed"
  - id: "ADR-BR-039"
    file: "039-config-fingerprint-port.md"
    title: "Configuration fingerprints come from a consumer port"
    status: "Proposed"
  - id: "ADR-BR-040"
    file: "040-versioned-contracts-in-core.md"
    title: "Contract versions and ranges are matched in core"
    status: "Proposed — amends ADR-BR-027 and ADR-BR-011"
  - id: "ADR-BR-041"
    file: "041-manifest-as-data.md"
    title: "A plugin manifest is data the core reads only for resolution"
    status: "Proposed"
  - id: "ADR-BR-042"
    file: "042-lazy-activation.md"
    title: "Lazy plugins are registered from their manifest and loaded on a trigger"
    status: "Proposed — amended by ADR-BR-050"
  - id: "ADR-BR-043"
    file: "043-plugin-principal-and-mandatory-policy.md"
    title: "A host-minted plugin principal and mandatory policy"
    status: "Proposed — amends ADR-BR-019 and ADR-BR-021"
  - id: "ADR-BR-044"
    file: "044-capability-policy-and-call-log-ports.md"
    title: "CapabilityPolicy and CallLog ports in core"
    status: "Proposed — amends ADR-BR-029; amended by ADR-BR-054"
  - id: "ADR-BR-045"
    file: "045-operation-context-annotations.md"
    title: "An extensible, typed annotation bag on OperationContext"
    status: "Proposed"
  - id: "ADR-BR-046"
    file: "046-hook-points.md"
    title: "Hook points are a policied dispatch over a contribution registry"
    status: "Proposed — amended by ADR-BR-050"
  - id: "ADR-BR-047"
    file: "047-generic-gate-and-plan.md"
    title: "A generic gate with a deferred outcome, and a read-only plan of reconcile"
    status: "Proposed"
  - id: "ADR-BR-048"
    file: "048-realm-families-and-retirement.md"
    title: "Realm families, ephemeral realms and realm retirement"
    status: "Proposed — amends ADR-BR-019"
  - id: "ADR-BR-049"
    file: "049-state-handoff-on-replace.md"
    title: "State handoff on replace, with an audited cold start"
    status: "Proposed"
  - id: "ADR-BR-050"
    file: "050-dormant-veto-and-hook-phases.md"
    title: "A declared veto of a plugin not yet loaded is woken or denies; hook phases run enrich, veto, advise"
    status: "Proposed — amends ADR-BR-042 and ADR-BR-046"
  - id: "ADR-BR-051"
    file: "051-atomic-bundle-apply.md"
    title: "Atomic bundle apply by ordered actions and reverse undo"
    status: "Proposed — amends ADR-BR-023"
  - id: "ADR-BR-052"
    file: "052-typed-registries.md"
    title: "Contribution registries may declare a contract"
    status: "Proposed — amends ADR-BR-024"
  - id: "ADR-BR-053"
    file: "053-refusal-list.md"
    title: "A refusal list consulted on every start"
    status: "Proposed — amends ADR-BR-032"
  - id: "ADR-BR-054"
    file: "054-correlation-in-the-fiber.md"
    title: "A correlation id in the fiber"
    status: "Proposed — amends ADR-BR-029 and ADR-BR-044"
