kind: decisions
package: bridger-remote
infix: RM
entries:
  - id: "ADR-RM-001"
    file: "001-remote-plugin-is-a-local-proxy.md"
    title: "A remote plugin is a local proxy plugin"
    status: "Proposed"
  - id: "ADR-RM-002"
    file: "002-partition-withdraws-the-session-child.md"
    title: "A partition withdraws the session child"
    status: "Proposed"
  - id: "ADR-RM-003"
    file: "003-sessions-carry-epochs.md"
    title: "Every session carries an epoch, compared by equality"
    status: "Proposed"
  - id: "ADR-RM-004"
    file: "004-bounded-calls-and-peer-free-lifecycle.md"
    title: "Remote calls always time out; lifecycle steps never wait on a peer"
    status: "Proposed"
  - id: "ADR-RM-005"
    file: "005-per-call-capability-tokens.md"
    title: "Per-call capability tokens; guests reach granted contracts only"
    status: "Proposed"
  - id: "ADR-RM-006"
    file: "006-isolation-comes-from-the-host.md"
    title: "Isolation comes from the host process or isolate, never from Bridger"
    status: "Proposed"
  - id: "ADR-RM-007"
    file: "007-stateless-guests.md"
    title: "Guests are stateless per invocation"
    status: "Proposed"
  - id: "ADR-RM-008"
    file: "008-unknown-outcomes-are-surfaced-never-retried.md"
    title: "Unknown outcomes are surfaced, never retried"
    status: "Proposed"
  - id: "ADR-RM-009"
    file: "009-deterministic-test-transport.md"
    title: "A deterministic test transport, and the core suites re-run through proxies"
    status: "Proposed"
