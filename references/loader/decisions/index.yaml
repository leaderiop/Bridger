kind: decisions
package: bridger-loader
infix: LD
entries:
  - id: "ADR-LD-001"
    file: "001-verify-before-evaluate.md"
    title: "Verify before evaluate, and evaluate the verified bytes"
    status: "Proposed"
  - id: "ADR-LD-002"
    file: "002-package-digest-commits-to-manifest-sbom-and-files.md"
    title: "The package digest commits to the manifest, the SBOM and the files"
    status: "Proposed"
  - id: "ADR-LD-003"
    file: "003-n-of-m-signature-policy-with-no-default.md"
    title: "An N-of-M signature policy over verifier adapters, with no default"
    status: "Proposed"
  - id: "ADR-LD-004"
    file: "004-revocation-acts-through-desired-state.md"
    title: "Revocation acts through desired state and reconcile"
    status: "Proposed"
  - id: "ADR-LD-005"
    file: "005-in-process-loading-is-for-first-party-code.md"
    title: "In-process loading is for first-party code; other code is fetched for guests run outside the host's runtime"
    status: "Proposed"
  - id: "ADR-LD-006"
    file: "006-one-verification-step-for-every-signed-statement.md"
    title: "One verification step for every signed statement"
    status: "Proposed"
  - id: "ADR-LD-007"
    file: "007-data-packs-are-verified-never-evaluated.md"
    title: "Data packs are verified and served as bytes, never evaluated"
    status: "Proposed"
  - id: "ADR-LD-008"
    file: "008-in-process-eligibility-is-a-signed-statement.md"
    title: "In-process eligibility is a signed statement of its own, and guests reach the host as remote links"
    status: "Proposed"
