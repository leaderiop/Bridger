<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apotheka Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE — throwaway. Open this file in a browser (double-click) or run: python3 -m http.server -d prototypes/apotheka-ui-PROTOTYPE -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap">
<style>
/* Layout: app shell — sidebar generated from installed plugins, top bar, work area; a floating bar switches Officine / Parapharmacie. */
:root{
  --bg:#f3f6f5; --panel:#ffffff; --panel-2:#f8faf9; --line:#e0e7e3; --line-2:#cdd8d3;
  --fg:#14201c; --muted:#5d6e68; --faint:#8b9b95;
  --accent:#0d7457; --accent-fg:#ffffff; --accent-soft:#e1f2eb; --accent-line:#a8d9c5;
  --ok:#17804f; --ok-soft:#e3f4ea; --warn:#a35a06; --warn-soft:#fcf0dd; --bad:#b4302f; --bad-soft:#fbe5e4; --info:#2a63b8; --info-soft:#e6eefb;
  --shadow:0 1px 2px rgba(16,32,28,.06),0 6px 24px rgba(16,32,28,.06);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
:root[data-variant="para"]{ --accent:#9a3566; --accent-soft:#f8e6ef; --accent-line:#e5b3cb; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --panel:#151d1a; --panel-2:#121916; --line:#24302c; --line-2:#33423d;
  --fg:#e4ece8; --muted:#9db0a8; --faint:#6c7f78;
  --accent:#43bf93; --accent-fg:#06140f; --accent-soft:#15332a; --accent-line:#2a5e4c;
  --ok:#55c98f; --ok-soft:#173326; --warn:#e8a65a; --warn-soft:#3a2a14; --bad:#ef7d7b; --bad-soft:#3d1d1c; --info:#7eaaf0; --info-soft:#18263d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
  :root:not([data-theme="light"])[data-variant="para"]{ --accent:#e07aab; --accent-soft:#3a1a2a; --accent-line:#6e3552; }}
:root[data-theme="dark"]{
  --bg:#0e1412; --panel:#151d1a; --panel-2:#121916; --line:#24302c; --line-2:#33423d;
  --fg:#e4ece8; --muted:#9db0a8; --faint:#6c7f78;
  --accent:#43bf93; --accent-fg:#06140f; --accent-soft:#15332a; --accent-line:#2a5e4c;
  --ok:#55c98f; --ok-soft:#173326; --warn:#e8a65a; --warn-soft:#3a2a14; --bad:#ef7d7b; --bad-soft:#3d1d1c; --info:#7eaaf0; --info-soft:#18263d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
:root[data-theme="dark"][data-variant="para"]{ --accent:#e07aab; --accent-soft:#3a1a2a; --accent-line:#6e3552; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
table{font:inherit;color:inherit}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,code{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-family:var(--display);letter-spacing:-.005em;text-wrap:balance}
p{margin:0}

/* shell */
.app{display:grid;grid-template-columns:244px 1fr;height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:700 15px var(--display)}
.brand b{font:700 17px var(--display)}
.brand small{display:block;color:var(--faint);font-size:11px;line-height:1.2}
.site{margin:0 12px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:12px}
.site b{display:block;font-size:13px}
.nav{flex:1;overflow:auto;padding:4px 8px 12px}
.nav h6{margin:14px 10px 4px;font:600 11.5px var(--body);color:var(--faint)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;text-align:left;color:var(--muted);cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--panel-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--fg);font-weight:500}
.nav button.on svg{color:var(--accent)}
.nav button .tag{margin-left:auto;font:500 10px var(--mono);color:var(--faint)}
.nav button .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font:600 10px var(--mono);padding:1px 6px}
.nav button.fresh{animation:fresh 1.6s ease}
@keyframes fresh{0%{background:var(--accent-line)}100%{background:transparent}}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;font-size:11.5px;color:var(--faint);display:grid;gap:4px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .crumb{font:600 15px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb small{font:400 12px var(--body);color:var(--faint);margin-left:8px}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px;color:var(--faint);cursor:pointer;min-width:220px}
.search kbd{margin-left:auto;font:500 11px var(--mono);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--line-2)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 10px/16px var(--mono);text-align:center;padding:0 4px}
.net{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;cursor:pointer;background:var(--panel);font-size:12.5px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.net.off i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.offbar{background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);padding:7px 18px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.offbar b{font-weight:600}
.work{flex:1;overflow:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) 110px 22px;min-height:0}
.work.full{padding:0;overflow:hidden;display:flex}

/* primitives */
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:24px;font-weight:700}
.page-h p{color:var(--muted);margin-top:4px;max-width:70ch}
.page-h .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:11px 16px;font-size:15px}
.btn:disabled{opacity:1;cursor:not-allowed;background:var(--panel-2);border-color:var(--line);color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h .sub{color:var(--faint);font-size:12px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--ok)} .down{color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:5px;font:500 11px/1.6 var(--body);padding:0 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2);white-space:nowrap}
.badge.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.badge.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.badge.info{color:var(--info);background:var(--info-soft);border-color:transparent}
.badge.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.badge.mono{font-family:var(--mono);font-size:10.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 12px var(--body);color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.tbl .r{text-align:right}
.tbl-wrap{overflow-x:auto}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:grid;gap:10px;align-content:start}
.split{display:grid;gap:16px;grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr);align-items:start}
.split.rev{grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr)}
@media (max-width:900px){.split,.split.rev{grid-template-columns:1fr}}
.sep{height:1px;background:var(--line);margin:10px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.input{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:8px 10px;width:100%}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--faint)}
.pill-toggle{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.pill-toggle button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.pill-toggle button.on{background:var(--accent);color:var(--accent-fg)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.timeline{display:flex;gap:0;align-items:flex-start}
.timeline .st{flex:1;min-width:0;display:grid;gap:4px;justify-items:center;text-align:center;font-size:10.5px;line-height:1.2;color:var(--faint);position:relative}
.timeline .st span{overflow-wrap:anywhere;padding:0 2px}
.timeline .st::before{content:"";position:absolute;top:7px;left:-50%;right:50%;height:2px;background:var(--line)}
.timeline .st:first-child::before{display:none}
.timeline .st i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);z-index:1}
.timeline .st.done{color:var(--fg)} .timeline .st.done i{background:var(--accent);border-color:var(--accent)} .timeline .st.done::before{background:var(--accent)}
.timeline .st.cur i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* advisory & veto cards */
.adv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.adv .ic{grid-row:span 3;width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.adv .src{font:500 11.5px var(--body);color:var(--faint)}
.adv b{font-size:13px}
.adv p{font-size:12.5px;color:var(--muted)}
.adv .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.adv.fresh{box-shadow:0 0 0 2px var(--accent-line);animation:glow 2.4s ease}
@keyframes glow{0%{box-shadow:0 0 0 6px var(--accent-line)}100%{box-shadow:0 0 0 2px var(--accent-line)}}
.newtag{display:inline-block;margin-left:6px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px;font:600 9.5px var(--body);letter-spacing:.02em;text-transform:none;vertical-align:1px}
.adv.veto{border-color:var(--bad);background:var(--bad-soft)} .adv.veto .ic{background:var(--bad);color:#fff}
.adv.warn .ic{background:var(--warn-soft);color:var(--warn)}
.adv.info .ic{background:var(--info-soft);color:var(--info)}
.adv.good .ic{background:var(--ok-soft);color:var(--ok)}
.adv.acc .ic{background:var(--accent-soft);color:var(--accent)}

/* drawer, modal, toast, palette */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.36);z-index:51;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .2s ease;z-index:52;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow:auto;padding:18px}
.drawer-f{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;justify-content:flex-end}
.modal{position:fixed;left:50%;top:8vh;transform:translateX(-50%);width:min(560px,calc(100% - 32px));max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:52;box-shadow:var(--shadow);animation:pop .18s ease}
@keyframes pop{from{transform:translate(-50%,8px);opacity:.3}}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));display:grid;gap:8px;z-index:60;width:min(380px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);animation:pop2 .2s ease;display:flex;gap:10px;align-items:flex-start}
.toast small{display:block;opacity:.7;font-size:11.5px}
@keyframes pop2{from{transform:translateY(8px);opacity:0}}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:61;box-shadow:var(--shadow);overflow:hidden}
.palette input{border:0;border-bottom:1px solid var(--line);width:100%;padding:16px 18px;font-size:16px;background:none;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer}
.palette li.on{background:var(--accent-soft)}
.palette li .p{margin-left:auto;font:500 10.5px var(--mono);color:var(--faint)}
.palette .foot{border-top:1px solid var(--line);padding:8px 14px;font-size:11.5px;color:var(--faint);display:flex;gap:14px}

/* variant switcher */
.vbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:6px;background:var(--fg);color:var(--bg);border-radius:999px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.vbar span{font:500 12px var(--body);opacity:.6;padding:0 8px 0 10px}
.vbar button{border:0;border-radius:999px;padding:7px 14px;background:transparent;color:inherit;cursor:pointer;font-weight:500;font-size:13px;opacity:.75}
.vbar button.on{background:var(--bg);color:var(--fg);opacity:1}
@media (max-width:560px){.vbar span{display:none}.vbar button{padding:7px 10px;font-size:12px;white-space:nowrap}}

/* guided tour: a strip under the top bar, never covering the screen it explains */
.tour{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 18px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.tour-steps{display:flex;flex-direction:column;gap:4px}
.tour-steps i{width:6px;height:6px;border-radius:50%;background:var(--accent-line);cursor:pointer}
.tour-steps i.done{background:var(--accent);opacity:.5}.tour-steps i.cur{background:var(--accent);transform:scale(1.5)}
.tour-k{font-size:12px;color:var(--accent);font-weight:500}
.tour h3{font-size:16.5px;margin:1px 0 2px}
.tour p{font-size:13px;color:var(--muted);max-width:92ch}
.tour .tour-try{color:var(--fg);margin-top:3px}
.build{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:6px}
.build-add{display:flex;flex-wrap:wrap;gap:6px}
.build-meter{display:flex;align-items:center;gap:8px;min-width:200px}
.build-meter .bar{width:120px}
.tour-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:900px){.tour{grid-template-columns:1fr}.tour-steps{flex-direction:row}.tour-acts{justify-content:flex-start}}

/* plugin anatomy */
.anat{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.anat-shell{display:grid;grid-template-columns:52px 1fr 1fr;grid-template-rows:22px 34px 46px;grid-template-areas:"m k k" "m t t" "m c s";gap:4px;aspect-ratio:200/112}
.az{border:1px dashed var(--line-2);border-radius:5px;font-size:10px;color:var(--faint);display:grid;place-items:center;text-align:center;line-height:1.1;padding:2px}
.az.on{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.anat-facts{display:grid;gap:6px;font-size:12.5px}
.anat-facts span{display:inline-block;min-width:34px;text-align:center;border-radius:999px;font-weight:600;font-size:11px;padding:0 6px;margin-right:8px}
.anat-facts .no{background:var(--ok-soft);color:var(--ok)} .anat-facts .yes{background:var(--warn-soft);color:var(--warn)}
@media (max-width:560px){.anat{grid-template-columns:1fr}}
.pulse{display:inline-block;animation:pulse .9s ease}
@keyframes pulse{0%{transform:scale(1.25)}100%{transform:none}}

/* intro: the pharmacy drawer cabinet */
.intro{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center;padding-block:48px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.intro-text{display:grid;gap:20px;align-content:center}
.intro h1{font:700 clamp(2.4rem,4.6vw,3.9rem)/1.02 var(--display);letter-spacing:-.025em;max-width:13ch}
.intro .lede{font-size:17px;color:var(--muted);max-width:56ch;line-height:1.55}
.intro-points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;border-top:1px solid var(--line);padding-top:16px}
.intro-points b{display:block;font-size:14px;margin-bottom:3px}
.intro-points span{font-size:13px;color:var(--muted)}
.cabinet{--wood:#7a5a3c;--wood-2:#664a31;--brass:#c9a35a;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;border-radius:12px;background:linear-gradient(180deg,var(--wood),var(--wood-2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 24px 50px rgba(40,25,10,.25)}
.tiroir{position:relative;height:76px;border-radius:5px;background:linear-gradient(180deg,#f6efe2,#e8dcc6);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),inset 0 0 0 1px rgba(0,0,0,.06);display:grid;justify-items:center;align-content:center;gap:9px;animation:drawerIn .55s cubic-bezier(.2,.8,.2,1) both}
.tiroir .plate{min-width:72%;max-width:90%;text-align:center;font:600 11.5px/1.25 var(--body);color:#3b2a18;padding:4px 6px;border-radius:3px;background:linear-gradient(180deg,#e7cf98,var(--brass));box-shadow:inset 0 0 0 1px rgba(80,55,15,.35)}
.tiroir .knob{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1d58f,#9c7a33);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tiroir.sys{background:linear-gradient(180deg,#eef3ef,#d9e5dd)}
.tiroir.ma{background:linear-gradient(180deg,#e9f4ee,#cfe6d9)}
.tiroir.empty{background:transparent;box-shadow:inset 0 0 0 1.5px dashed rgba(255,255,255,.35);border:1.5px dashed rgba(255,255,255,.4)}
.tiroir.empty .plate{background:transparent;box-shadow:none;color:rgba(255,255,255,.85)}
.tiroir.empty .knob{display:none}
.tiroir .seal{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#0d7457;color:#fff}
@keyframes drawerIn{from{transform:translateY(10px) scale(.96);opacity:0}}
.cabinet-legend{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#f4e9d6;padding-top:6px}
.cabinet-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg-sys{background:#d9e5dd}.lg-ma{background:#0d7457}.lg-plug{background:#e8dcc6}
@media (max-width:980px){.intro{grid-template-columns:1fr;gap:28px}.intro-points{grid-template-columns:1fr}}
@media (max-width:560px){.cabinet{grid-template-columns:repeat(2,1fr)}.tiroir{height:64px}}

/* install modal */
.imodal{width:min(780px,calc(100% - 32px));top:5vh;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.im-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.im-head h3{font-size:19px}
.im-icons{display:flex;gap:6px}
.im-body{overflow:auto;padding:18px 20px;display:grid;gap:18px}
.im-sec h4,.im-ba h4{font:600 13px var(--body);color:var(--muted);margin:0 0 8px}
.im-plug{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.im-plug:last-child{border-bottom:0}
.im-changes{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.im-changes li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:8px;font-size:13px}
.im-changes li svg{color:var(--accent)}
.im-ba{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.im-before,.im-after{border-radius:10px;padding:12px 14px;font-size:13px}
.im-before{background:var(--panel-2);border:1px dashed var(--line-2);color:var(--muted)}
.im-after{background:var(--accent-soft);border:1px solid var(--accent-line)}
.im-after h4{color:var(--accent)}
.im-before ul,.im-after ul{margin:0;padding-left:1.1em;display:grid;gap:5px}
.im-arrow{display:grid;place-items:center;color:var(--accent)}
.im-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line)}
@media (max-width:640px){.im-ba{grid-template-columns:1fr}.im-arrow{transform:rotate(90deg)}}

/* counter (POS) */
.pos{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.25fr) minmax(300px,.9fr);flex:1;min-height:0}
.pos > section{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.pos > section:last-child{border-right:0;background:var(--panel)}
.pos .ph{padding:14px 16px 10px;display:grid;gap:10px}
.pos .scroll{flex:1;overflow:auto;padding:0 16px 84px}
.scan{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent-line);background:var(--panel);border-radius:10px;padding:10px 12px}
.scan input{border:0;outline:none;background:none;flex:1;font-size:15px}
.prod{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;margin-bottom:8px}
.prod:hover{border-color:var(--accent-line)}
.prod b{font-size:13.5px;font-weight:600}
.prod .meta{font-size:11.5px;color:var(--faint)}
.prod .price{font:600 14px var(--mono);text-align:right}
.prod .flags{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.line{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line b{font-size:14px;font-weight:600}
.line .meta{font-size:11.5px;color:var(--faint);grid-column:1/2}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px}
.qty button{border:0;background:none;width:28px;height:28px;cursor:pointer;color:var(--muted)}
.qty span{min-width:22px;text-align:center;font:500 13px var(--mono)}
.amount{font:600 14px var(--mono);min-width:86px;text-align:right}
.totals{display:grid;gap:6px;font-size:13px}
.totals div{display:flex;justify-content:space-between}
.totals .big{font:700 22px var(--display);padding-top:6px;border-top:1px solid var(--line)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay button{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:9px 6px;cursor:pointer;font-size:12.5px;display:grid;justify-items:center;gap:3px}
.pay button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.cust{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--panel-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--display);flex:none}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
.thumb{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--display);color:#fff;flex:none}

/* receipt */
.receipt{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px dashed var(--line-2);border-radius:8px;padding:16px;display:grid;gap:3px}
.receipt .c{text-align:center}
.receipt .rr{display:flex;justify-content:space-between;gap:10px}
.receipt hr{border:0;border-top:1px dashed var(--line-2);width:100%;margin:6px 0}

/* marketplace */
.mk-card{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;align-content:start}
.mk-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.mk-card .h{display:flex;gap:10px;align-items:flex-start}
.mk-ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.mk-card b{font-size:14px}
.mk-card .pub{font-size:11.5px;color:var(--faint)}
.mk-card p{font-size:12.5px;color:var(--muted)}
.mk-card .f{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.perm{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.perm:last-child{border-bottom:0}
.manifest{font:12px/1.55 var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;white-space:pre}

/* agent */
.task{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;display:grid;gap:8px}
.task .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--body)}
.state i{width:8px;height:8px;border-radius:50%}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.draft{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.draft .dl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.draft .dl:last-child{border-bottom:0}
.draft .dl.rej{opacity:.45;text-decoration:line-through}

/* mini charts */
.spark{width:100%;height:46px;display:block}
.hbars{display:grid;gap:8px}
.hbars .hb{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:12.5px}
.hbars .hb div{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.hbars .hb div i{display:block;height:100%;border-radius:999px;background:var(--accent)}


/* theme engine: tokens come from <style id="apo-theme">; these rules make radius, density and logo follow them */
:root[data-apo-theme] body{font-size:var(--fs,14px)}
:root[data-apo-theme] .work > *,:root[data-apo-theme] .side .nav{zoom:var(--zoom,1)}
:root[data-apo-theme] :is(.btn,.iconbtn,.search,.input,.pill-toggle,.site,.nav button,.mk-ic,.prod,.scan,.cust,.pay button,.qty,.adv,.receipt,.manifest,.im-changes li,.im-before,.im-after,.anat,.palette li,.draft,.mk-card,.task){border-radius:calc(var(--r) * .8)}
:root[data-apo-theme] :is(.modal,.palette,.drawer-b .card){border-radius:calc(var(--r) + 4px)}
.brand .logo,.pv-brand .logo,.ap-logo{background:var(--touch,var(--accent));color:var(--touch-fg,var(--accent-fg));border-radius:calc(var(--r) * .75);letter-spacing:.02em}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
body,.btn,.nav button{transition:background-color .25s,color .25s,border-color .25s}

/* Apparence */
.ap{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:22px;align-items:start}
.ap-ctl{display:grid;gap:14px;min-width:0}
.ap-sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px}
.ap-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ap-h h3{font-size:15px}
.th-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.th-card{display:grid;gap:8px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:calc(var(--r) * .8);background:var(--panel);cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.th-card:hover{border-color:var(--line-2)}
.th-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.th-strip{display:flex;border-radius:calc(var(--r) * .5);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.th-strip i{flex:1}.th-strip i:nth-child(3){flex:1.8}
.th-meta{display:flex;gap:9px;align-items:center;min-width:0}
.th-meta b{display:block;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-meta small{display:block;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-aa{font-size:22px;font-weight:700;line-height:1;flex:none;width:30px;color:var(--fg)}
.th-tags{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.th-tags .badge{font-size:10px;padding:0 6px}
.ap-row{display:grid;gap:7px}
.ap-row > label{font-size:12.5px;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.ap-row .swatch{width:24px;height:24px}
.ap-row .swatch.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.ap-color{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:2px 9px 2px 3px;cursor:pointer}
.ap-color input{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.ap-color input::-webkit-color-swatch-wrapper{padding:0}.ap-color input::-webkit-color-swatch{border:0;border-radius:50%}
.ap-range{flex:1;accent-color:var(--accent);min-width:0}
.ap-corner{width:18px;height:18px;border-top:2px solid var(--muted);border-left:2px solid var(--muted);flex:none}
.seg{display:flex;width:100%}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px}
.seg button + button{border-left:1px solid var(--line)}
.fp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fp{display:grid;gap:1px;justify-items:start;text-align:left;padding:8px 9px;border:1px solid var(--line);border-radius:calc(var(--r) * .8);background:var(--panel);cursor:pointer;min-width:0}
.fp.on{border-color:var(--accent);background:var(--accent-soft)}
.fp-aa{font-size:22px;font-weight:700;line-height:1.1}
.fp b{font-size:12px}.fp small{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ap-brand{display:flex;gap:8px;align-items:center}
.ap-logo{width:36px;height:36px;flex:none;display:grid;place-items:center;font:700 13px var(--display)}
.scope{display:grid;gap:6px}
.scope-o{display:grid;grid-template-columns:20px 1fr 16px;gap:10px;align-items:center;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:calc(var(--r) * .8);background:var(--panel);cursor:pointer;color:var(--muted)}
.scope-o b{display:block;font-size:13px;color:var(--fg);font-weight:600}.scope-o small{font-size:11.5px;color:var(--faint)}
.scope-o i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2)}
.scope-o.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.scope-o.on i{border:5px solid var(--accent)}
.shops{display:flex;flex-wrap:wrap;gap:6px}
.shop{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px dashed var(--line-2);color:var(--faint)}
.shop.on{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);color:var(--fg)}
.shop em{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:11px}
.ap-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap-acts .btn{justify-content:center}.ap-acts .btn.pri{grid-column:1/-1;padding:10px 12px}
.ap-note{border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;background:var(--panel-2);display:grid;gap:8px;font-size:13px}
.ap-note-h{display:flex;gap:8px;align-items:center}.ap-note-h svg{color:var(--accent)}
.ap-note p{color:var(--muted)}
.ap-cando{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ap-cando h6{margin:0 0 4px;font:600 11.5px var(--body);color:var(--faint)}
.ap-cando ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.ap-cando li::before{content:"+";display:inline-block;width:14px;color:var(--accent);font-weight:700}
.ap-cando ul.no li::before{content:"×";color:var(--faint)}
.ap-pv{display:grid;gap:10px;min-width:0}
@media (min-width:1181px) and (min-height:760px){.ap-pv{position:sticky;top:0}}
.pv-cap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-cap b{font:600 15px var(--display)}
.pv{display:grid;grid-template-columns:156px minmax(0,1fr);border:1px solid var(--line-2);border-radius:calc(var(--r) + 6px);overflow:hidden;background:var(--bg);box-shadow:var(--shadow);min-height:470px}
.pv-side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:grid;gap:3px;align-content:start}
.pv-brand{display:flex;gap:9px;align-items:center;padding:0 4px 12px}
.pv-brand .logo{width:30px;height:30px;flex:none;display:grid;place-items:center;font:700 12.5px var(--display)}
.pv-brand b{display:block;font:700 14px/1.15 var(--display);overflow-wrap:anywhere}
.pv-brand small{display:block;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-nav{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:calc(var(--r) * .7);font-size:12.5px;color:var(--muted)}
.pv-nav.on{background:var(--accent-soft);color:var(--fg);font-weight:500}.pv-nav.on svg{color:var(--accent)}
.pv-main{display:flex;flex-direction:column;min-width:0;container-type:inline-size}
.pv-top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.pv-top b{font:600 14px var(--display)}
.pv-scan{flex:1;display:flex;gap:8px;align-items:center;border:1.5px solid var(--accent-line);border-radius:calc(var(--r) * .8);padding:6px 10px;color:var(--faint);font-size:12.5px;background:var(--panel)}
.pv-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;padding:14px;flex:1}
@container (max-width:540px){.pv-body{grid-template-columns:1fr}.pv-aside{grid-template-columns:1fr 1fr}.pv-aside .adv{grid-column:1}.pv-rc{grid-column:2;grid-row:1 / span 2}}
.pv-ticket{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.pv-th{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--display);padding-bottom:6px}
.pv-line{display:grid;grid-template-columns:1fr auto 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pv-line b{display:block;font-weight:600}.pv-line small{display:block;font-size:11px;color:var(--faint)}
.pv-line .mono{text-align:right}.pv-q{font:500 12px var(--mono);color:var(--muted)}
.pv-tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 12px}
.pv-tot b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.pv-pay{flex:1;justify-content:center;padding:10px 12px;font-size:14px}
.pv-aside{display:grid;gap:10px;align-content:start;min-width:0}
.pv-rc{font-size:11px;padding:12px}
.pv-lock{display:flex;gap:5px;align-items:center;justify-content:center;color:var(--faint);font-size:10px;margin-top:4px}
.pv-fixed{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.pv-fixed svg{vertical-align:-2px}
.pv-sem{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pv-sem i{width:10px;height:10px;border-radius:50%;margin-left:6px}
.im-theme{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:10px}
.im-theme span:not(.th-strip){font-size:20px;font-weight:700;line-height:1}
.im-theme small{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
@media (max-width:1180px){.pv{grid-template-columns:140px minmax(0,1fr)}}
@media (max-width:980px){.ap{grid-template-columns:1fr}.ap-pv{position:static}}
@media (max-width:560px){.pv{grid-template-columns:1fr}.pv-side{display:none}.fp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ap-cando{grid-template-columns:1fr}.th-grid{grid-template-columns:1fr 1fr}}

@media (max-width:1100px){.pos{grid-template-columns:1fr 1fr}.pos > section:first-child{grid-column:1/-1;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:grid!important}
